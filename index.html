<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Countdown Idul Adha</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    text-align: center;
    overflow: hidden;

    background: linear-gradient(135deg, #1e3c72, #2a5298);
}

/* Bintang */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(white 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.15;
}

/* Siluet bukit */
.hill {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 150px;
    background: #0b1d3a;
    border-top-left-radius: 50% 100%;
    border-top-right-radius: 50% 100%;
}

/* Domba simple pakai CSS */
.sheep {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
}

.body {
    width: 80px;
    height: 50px;
    background: white;
    border-radius: 50px;
}

.head {
    width: 35px;
    height: 35px;
    background: #222;
    border-radius: 50%;
    position: absolute;
    left: -25px;
    top: 5px;
}

/* Container */
.container {
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.08);
    padding: 50px;
    border-radius: 25px;
    box-shadow: 0 0 50px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    z-index: 2;
}

h1 {
    font-size: 2.8em;
    margin-bottom: 10px;
}

.arabic {
    font-size: 1.5em;
    margin-bottom: 25px;
}

/* Countdown */
.countdown {
    display: flex;
    gap: 20px;
    justify-content: center;
}

.box {
    background: rgba(255,255,255,0.12);
    padding: 20px;
    border-radius: 15px;
    min-width: 90px;
}

.number {
    font-size: 2.2em;
    font-weight: bold;
}

.label {
    font-size: 0.8em;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="sheep">
    <div class="body"></div>
    <div class="head"></div>
</div>

<div class="hill"></div>

<div class="container">
    <h1>Idul Adha 🐐</h1>
    <div class="arabic">عيد الأضحى</div>

    <div class="countdown">
        <div class="box">
            <div id="days" class="number">0</div>
            <div class="label">Hari</div>
        </div>
        <div class="box">
            <div id="hours" class="number">0</div>
            <div class="label">Jam</div>
        </div>
        <div class="box">
            <div id="minutes" class="number">0</div>
            <div class="label">Menit</div>
        </div>
        <div class="box">
            <div id="seconds" class="number">0</div>
            <div class="label">Detik</div>
        </div>
    </div>
</div>

<script>
const targetDate = new Date("May 27, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance < 0) {
        document.body.innerHTML = "<h1>Selamat Idul Adha 🐐✨</h1>";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("days").innerText = days;
    document.getElementById("hours").innerText = hours;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("seconds").innerText = seconds;
}

setInterval(updateCountdown, 1000);
</script>

</body>
</html>
