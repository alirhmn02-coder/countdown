<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Countdown Idul Adha</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    text-align: center;
    overflow: hidden;

    background: linear-gradient(135deg, #1e3c72, #2a5298);
}

/* Ilustrasi kambing/domba (pattern halus) */
body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: url('https://www.transparenttextures.com/patterns/cartographer.png');
    opacity: 0.15;
}

/* Siluet domba bawah */
body::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 180px;
    background: url('https://svgshare.com/i/15rG.svg') no-repeat center bottom;
    background-size: contain;
    opacity: 0.3;
}

/* Container */
.container {
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.08);
    padding: 50px;
    border-radius: 25px;
    box-shadow: 0 0 50px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    z-index: 1;
}

/* Judul */
h1 {
    font-size: 2.8em;
    margin-bottom: 10px;
    letter-spacing: 2px;
}

/* Arab */
.arabic {
    font-size: 1.5em;
    margin-bottom: 25px;
    opacity: 0.8;
}

/* Countdown */
.countdown {
    display: flex;
    gap: 20px;
    justify-content: center;
}

/* Box */
.box {
    background: rgba(255,255,255,0.12);
    padding: 20px;
    border-radius: 15px;
    min-width: 90px;
}

/* Angka */
.number {
    font-size: 2.2em;
    font-weight: bold;
}

/* Label */
.label {
    font-size: 0.8em;
    opacity: 0.7;
}

/* Footer */
footer {
    margin-top: 20px;
    font-size: 0.85em;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="container">
    <h1>Idul Adha 🐐</h1>
    <div class="arabic">عيد الأضحى</div>

    <div class="countdown">
        <div class="box">
            <div id="days" class="number">0</div>
            <div class="label">Hari</div>
        </div>
        <div class="box">
            <div id="hours" class="number">0</div>
            <div class="label">Jam</div>
        </div>
        <div class="box">
            <div id="minutes" class="number">0</div>
            <div class="label">Menit</div>
        </div>
        <div class="box">
            <div id="seconds" class="number">0</div>
            <div class="label">Detik</div>
        </div>
    </div>

    <footer>Menuju Hari Raya 🌙</footer>
</div>

<script>
const targetDate = new Date("May 27, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance < 0) {
        document.body.innerHTML = "<h1>Selamat Idul Adha 🐐✨</h1>";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("days").innerText = days;
    document.getElementById("hours").innerText = hours;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("seconds").innerText = seconds;
}

setInterval(updateCountdown, 1000);
</script>

</body>
</html>
