<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Countdown Idul Adha</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    text-align: center;

    /* 🔥 BACKGROUND GAMBAR HEWAN QURBAN */
    background: url('gg.jpg') no-repeat center center/cover;
}

/* Overlay biar gelap elegan */
body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 0;
}

.container {
    position: relative;
    z-index: 1;

    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.1);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
}

h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
    letter-spacing: 2px;
}

.arabic {
    font-size: 1.5em;
    margin-bottom: 20px;
    opacity: 0.9;
}

.countdown {
    display: flex;
    gap: 20px;
    justify-content: center;
    font-size: 1.5em;
}

.box {
    background: rgba(255,255,255,0.15);
    padding: 20px;
    border-radius: 15px;
    min-width: 80px;
}

.number {
    font-size: 2em;
    font-weight: bold;
}

.label {
    font-size: 0.8em;
    opacity: 0.7;
}

footer {
    margin-top: 20px;
    font-size: 0.8em;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="container">
    <h1>Idul Adha</h1>
    <div class="arabic">عيد الأضحى</div>

    <div class="countdown">
        <div class="box">
            <div id="days" class="number">0</div>
            <div class="label">Hari</div>
        </div>
        <div class="box">
            <div id="hours" class="number">0</div>
            <div class="label">Jam</div>
        </div>
        <div class="box">
            <div id="minutes" class="number">0</div>
            <div class="label">Menit</div>
        </div>
        <div class="box">
            <div id="seconds" class="number">0</div>
            <div class="label">Detik</div>
        </div>
    </div>

    <footer>✨Menuju Hari Raya✨</footer>
</div>

<script>
const targetDate = new Date("May 27, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance < 0) {
        document.body.innerHTML = "<h1>✨Selamat Idul Adha✨</h1>";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("days").innerText = days;
    document.getElementById("hours").innerText = hours;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("seconds").innerText = seconds;
}

setInterval(updateCountdown, 1000);
</script>

</body>
</html>
